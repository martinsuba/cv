version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm:
        patterns: ['*']
    ignore:
      # Stryker is pinned exactly (runner and core must match, vitest-runner supports specific Vitest
      # majors); no major bumps. Vitest follows normally again.
      - dependency-name: '@stryker-mutator/*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
