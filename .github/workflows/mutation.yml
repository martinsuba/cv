name: mutation
# Node/JS projects. NOT a required check. Runs only on milestone PRs (branch chore/milestone-*), report is a run artifact.
# Other stacks: same shape with their tool (Python: mutmut or cosmic-ray). Mutation testing is too heavy for the 4 GB VPS.
on:
  pull_request:
  workflow_dispatch:
jobs:
  mutation:
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.head_ref, 'chore/milestone-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx stryker run
      - name: Job summary (score and counts)
        if: always()
        run: node scripts/mutation-summary.js
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
          retention-days: 30
